<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arvin D. Yapliong — Business Card</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --ink-deep:#081C37; --ink-mid:#103D6D; --ink:#0A2647;
    --mute:#48607F; --line:#C7D5E4; --lime:#A6C42B; --paper:#EDF1F6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:32px}
  .card{width:min(100%,1000px);aspect-ratio:16/9;align-self:center;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(8,28,55,.22);background:#fff}
  .grid{display:grid;grid-template-columns:38% 62%;height:100%}
  .left{background:linear-gradient(155deg,var(--ink-deep),var(--ink-mid));color:#fff;padding:8%;display:flex;flex-direction:column;justify-content:center}
  .left h1{font-size:clamp(38px,6vw,76px);margin:0 0 10px;letter-spacing:.03em}
  .left .lime{color:var(--lime)}
  .left .dept{font-weight:700;font-size:clamp(12px,1.4vw,18px);color:#cedbeb;letter-spacing:.08em}
  .left .tagline{margin-top:24px;font-weight:700;letter-spacing:.06em;font-size:clamp(10px,1.2vw,15px);color:var(--lime)}
  .right{padding:8%;display:flex;flex-direction:column;justify-content:center;position:relative}
  .name{font-size:clamp(26px,3.6vw,50px);font-weight:800;color:var(--ink);margin:0;text-transform:uppercase}
  .role{font-size:clamp(16px,1.9vw,26px);font-weight:700;color:var(--ink-mid);margin-top:8px}
  .dept2{font-size:clamp(13px,1.5vw,20px);color:var(--mute);margin-top:5px}
  .line{height:2px;background:var(--line);margin:22px 0}
  .contact a{display:block;color:var(--ink);text-decoration:none;margin:9px 0;font-size:clamp(13px,1.4vw,18px)}
  .contact a:hover{color:var(--ink-mid)}
  .qr{position:absolute;right:6%;bottom:8%;width:15%;min-width:80px;max-width:120px;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
  .save{display:none}
  @media print{
    body{background:#fff;padding:0}
    .card{box-shadow:none;width:100%}
    .save{display:none !important}
  }
  @media(max-width:720px){
    .card{aspect-ratio:auto}
    .grid{grid-template-columns:1fr}
    .left{padding:8% 8%}
    .right{padding:8% 8%}
    .qr{display:none}
  }
  .save{position:fixed;top:16px;right:16px;background:var(--ink);color:#fff;border:none;padding:.65rem 1.1rem;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer}
  .save:hover{background:var(--ink-mid)}
</style>
</head>
<body>
<button class="save" onclick="window.print()">Print / Save as PDF</button>
<div class="card">
  <div class="grid">
    <section class="left">
      <h1>MSM<span class="lime">A</span></h1>
      <div class="dept">SOLUTIONS DEPARTMENT</div>
      <div class="tagline">BUILDING SOLUTIONS.<br>DRIVING PROGRESS.</div>
    </section>
    <section class="right">
      <h2 class="name">Arvin D. Yapliong</h2>
      <div class="role">IT Associate | Developer</div>
      <div class="dept2">MSMA Solutions Department</div>
      <div class="line"></div>
      <div class="contact">
        <a href="mailto:ady.msma@gmail.com">✉ ady.msma@gmail.com</a>
        <a href="tel:+639670872093">☎ 09670872093</a>
        <a href="https://adymsma-works.github.io/arvindymsma.solutions/" target="_blank" rel="noopener">↗ adymsma-works.github.io/arvindymsma.solutions</a>
      </div>
      <img class="qr" src="qr.png" width="120" height="120" alt="QR code linking to this portfolio">
    </section>
  </div>
</div>
</body>
</html>
